name: Build mc3port for RK3326

on:
  workflow_dispatch:
    inputs:
      strict_patches:
        description: "Build abbrechen, wenn ein Patch nichts aendert oder sein Muster nicht findet"
        type: boolean
        default: false
      skip_patches:
        description: "Patches ueberspringen (Komma-Liste, z. B. mc3-linux-cmake.py)"
        type: string
        default: ""
      max_glibc:
        description: "Maximal erlaubte GLIBC-Version auf dem Geraet (z. B. 2.30 oder 2.31)"
        type: string
        default: "2.30"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README.md"
      - "README_2.md"
      - "THIRD_PARTY.md"

permissions:
  contents: write

jobs:
  build:
    name: Build host (aarch64) for M9 Pro / RK3326
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: /github/workspace/sysroot
      SDL2_INSTALL: /github/workspace/sdl2-install
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_PATH: /github/workspace/sysroot/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig
      JOBS: "4"
      MC3_PATCH_STRICT: "0"
      MC3_SKIP_PATCHES: ""
      MAX_GLIBC: "2.30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure runtime options
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.strict_patches }}" = "true" ]; then
              echo "MC3_PATCH_STRICT=1" >> "$GITHUB_ENV"
            fi
            echo "MC3_SKIP_PATCHES=${{ inputs.skip_patches }}" >> "$GITHUB_ENV"
            echo "MAX_GLIBC=${{ inputs.max_glibc }}" >> "$GITHUB_ENV"
          fi

      - name: Make build script executable
        run: chmod +x ./scripts/build-mc3port-rk3326.sh

      - name: Build and package mc3port for RK3326
        run: bash ./scripts/build-mc3port-rk3326.sh

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-log
          path: patch.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload patched sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-sources
          path: patched-sources/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload RK3326 bundle
        uses: actions/upload-artifact@v4
        with:
          name: mc3port-rk3326
          path: dist/mc3port-rk3326.tar.gz
          retention-days: 30
          if-no-files-found: error
