name: Build mc3port for M9 Pro (RK3326 / aarch64)

on:
  workflow_dispatch:
    inputs:
      strict_patches:
        description: 'Build abbrechen, wenn ein Patch nichts aendert oder sein Muster nicht findet'
        type: boolean
        default: false
      skip_patches:
        description: 'Patches ueberspringen (Komma-Liste, z. B. mc3-linux-cmake.py,mc3-gles-init.py)'
        type: string
        default: ''
      build_type:
        description: 'CMake Build-Typ (RelWithDebInfo oder Release)'
        type: choice
        options:
          - RelWithDebInfo
          - Release
        default: RelWithDebInfo
      max_glibc:
        description: 'Maximal erlaubte GLIBC-Version auf dem Geraet (ArkOS4Clone meist 2.30)'
        type: string
        default: '2.30'
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - 'THIRD_PARTY.md'

permissions:
  contents: write

jobs:
  build:
    name: Build host (aarch64) for M9 Pro / RK3326
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      SDL2_INSTALL: ${{ github.workspace }}/sdl2-install
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_PATH: ${{ github.workspace }}/sysroot/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig
      JOBS: "4"
      BUILD_DIR: ${{ github.workspace }}/build/rk3326-aarch64
      MAX_GLIBC: ${{ github.event_name == 'workflow_dispatch' && inputs.max_glibc || '2.30' }}
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'RelWithDebInfo' }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Repo- und Submodul-Struktur pruefen
        run: |
          echo "== Root =="
          ls -la
          echo "== patches/ =="
          ls -la patches/ 2>/dev/null || echo "Kein patches/-Verzeichnis vorhanden"
          echo "== scripts/ =="
          ls -la scripts/ 2>/dev/null || echo "Kein scripts/-Verzeichnis vorhanden"
          echo "== external/xport =="
          ls -la external/xport 2>/dev/null || echo "Kein external/xport gefunden"
          echo "== third_party/imgui =="
          ls -la third_party/imgui 2>/dev/null || echo "Kein third_party/imgui gefunden"

      - name: aarch64 Multiarch aktivieren
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: CMake 3.28.3 installieren
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends wget ca-certificates
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz
          tar -xzf cmake-3.28.3-linux-x86_64.tar.gz -C /opt
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/cmake  /usr/local/bin/cmake
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/ctest  /usr/local/bin/ctest
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/cpack  /usr/local/bin/cpack
          rm -f cmake-3.28.3-linux-x86_64.tar.gz
          cmake --version

      - name: Native Build-Tools installieren
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            build-essential ninja-build git curl wget ca-certificates \
            pkg-config python3 python3-pip file patchelf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            unzip p7zip-full libarchive-tools zstd xz-utils

      - name: aarch64 Dev-Pakete installieren
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libgbm-dev:arm64 libegl-dev:arm64 \
            libgles2-mesa-dev:arm64 libasound2-dev:arm64 libudev-dev:arm64 \
            libarchive-dev:arm64 zlib1g-dev:arm64 libbz2-dev:arm64 \
            liblzma-dev:arm64 libzstd-dev:arm64 liblz4-dev:arm64 \
            libwayland-dev:arm64 libpulse-dev:arm64 libxkbcommon-dev:arm64

      - name: Cross-Sysroot einrichten
        run: |
          set -euo pipefail
          if [ -f scripts/ci-setup-sysroot.sh ]; then
            bash scripts/ci-setup-sysroot.sh
          else
            mkdir -p "$SYSROOT_LIB/lib" "$SYSROOT_LIB/include" "$SYSROOT_LIB/pkgconfig"
            for d in /usr/lib/aarch64-linux-gnu/pkgconfig /usr/share/pkgconfig; do
              [ -d "$d" ] && cp -rn "$d"/* "$SYSROOT_LIB/pkgconfig/" 2>/dev/null || true
            done
          fi

      - name: SDL2 (KMSDRM + ALSA) fuer aarch64 bauen
        run: |
          set -euo pipefail
          if [ -f scripts/ci-build-sdl2.sh ]; then
            bash scripts/ci-build-sdl2.sh
          else
            SDL2_VER="2.30.10"
            mkdir -p /tmp/sdl2-src /tmp/sdl2-build "$SDL2_INSTALL"
            wget -q -O /tmp/sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
            tar -xzf /tmp/sdl2.tar.gz -C /tmp/sdl2-src --strip-components=1
            cmake -S /tmp/sdl2-src -B /tmp/sdl2-build -G Ninja \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_C_FLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe" \
              -DCMAKE_INSTALL_PREFIX="$SDL2_INSTALL" \
              -DSDL_STATIC=OFF \
              -DSDL_SHARED=ON \
              -DSDL_KMSDRM=ON \
              -DSDL_ALSA=ON \
              -DSDL_OPENGLES=ON \
              -DSDL_X11=OFF \
              -DSDL_WAYLAND=OFF
            cmake --build /tmp/sdl2-build -j "$JOBS"
            cmake --install /tmp/sdl2-build
            rm -rf /tmp/sdl2.tar.gz /tmp/sdl2-src /tmp/sdl2-build
          fi

      - name: Stubs (libmali, libdecor) vorbereiten
        run: |
          set -euo pipefail
          if [ -f scripts/ci-build-stubs.sh ]; then
            bash scripts/ci-build-stubs.sh
          else
            mkdir -p "$SYSROOT_LIB/lib" "$SYSROOT_LIB/include"
          fi

      - name: CMake Toolchain fuer RK3326 / ArkOS4Clone generieren
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/cmake"
          if [ ! -f "$GITHUB_WORKSPACE/cmake/aarch64-arkos.cmake" ]; then
            cat > "$GITHUB_WORKSPACE/cmake/aarch64-arkos.cmake" <<'EOF'
set(CMAKE_SYSTEM_NAME Linux)
set(CMAKE_SYSTEM_PROCESSOR aarch64)

set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
set(CMAKE_AR aarch64-linux-gnu-ar)
set(CMAKE_RANLIB aarch64-linux-gnu-ranlib)
set(CMAKE_STRIP aarch64-linux-gnu-strip)

set(RK3326_ARCH_FLAGS "-mcpu=cortex-a35 -mtune=cortex-a35 -pipe")
set(CMAKE_C_FLAGS_INIT "${RK3326_ARCH_FLAGS}")
set(CMAKE_CXX_FLAGS_INIT "${RK3326_ARCH_FLAGS}")

set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
EOF
          fi

      - name: Patches reparieren (main()-Einstiegspunkte)
        run: |
          set -uo pipefail

          REPAIRED=0
          SKIPPED_ALREADY=0
          SKIPPED_NO_MAIN=0

          for f in patches/mc3-*.py mc3-*.py; do
            [ -f "$f" ] || continue

            if ! grep -qE '^def main\(' "$f"; then
              SKIPPED_NO_MAIN=$((SKIPPED_NO_MAIN + 1))
              continue
            fi

            if grep -qE '__main__|^main\(\)' "$f"; then
              SKIPPED_ALREADY=$((SKIPPED_ALREADY + 1))
              continue
            fi

            printf '\n\nif __name__ == "__main__":\n    main()\n' >> "$f"
            echo "  repariert: $f"
            REPAIRED=$((REPAIRED + 1))
          done

          echo "Reparatur: repariert=$REPAIRED schon=$SKIPPED_ALREADY ohne_main=$SKIPPED_NO_MAIN"

      - name: Patches anwenden
        env:
          MC3_PATCH_STRICT: ${{ (github.event_name == 'workflow_dispatch' && inputs.strict_patches) && '1' || '0' }}
          MC3_SKIP_PATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_patches || '' }}
        run: |
          set -euo pipefail

          find_script() {
            local name="$1"
            if [ -f "patches/$name" ]; then echo "patches/$name"
            elif [ -f "$name" ];      then echo "$name"
            else echo ""; fi
          }

          : > patch.log

          tree_hash() {
            find . -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.c' \
                              -o -name '*.cmake' -o -name '*.ini' \) \
              -not -path './.git/*' -not -path './build/*' -not -path './sysroot/*' \
              -not -path './sdl2-install/*' -not -path './dist/*' -not -path './patched-sources/*' \
              -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16
          }

          apply() {
            local name="$1" target="$2" S h1 h2 rc
            if [ -n "${MC3_SKIP_PATCHES:-}" ]; then
              case ",${MC3_SKIP_PATCHES// /}," in
                *",$name,"*|*",${name%.py},"*)
                  echo "== patches/$name == UEBERSPRUNGEN (skip_patches)" | tee -a patch.log
                  return 0 ;;
              esac
            fi
            S=$(find_script "$name")
            if [ -z "$S" ]; then
              echo "PATCH-WARNUNG: $name FEHLT (weder in patches/ noch im Repo-Root)" | tee -a patch.log
              return 0
            fi
            echo "== $S ==" | tee -a patch.log
            echo "   Skript: $(wc -c < "$S") Bytes, $(wc -l < "$S") Zeilen" | tee -a patch.log
            if [ ! -e "$target" ]; then
              echo "PATCH-WARNUNG: $name: Ziel '$target' existiert nicht" | tee -a patch.log
            fi
            if grep -qE '^def main\(' "$S" && ! grep -qE '__main__|^main\(\)' "$S"; then
              echo "PATCH-WARNUNG: $name definiert main(), ruft es aber nie auf - das Skript tut nichts" | tee -a patch.log
            fi
            h1=$(tree_hash)
            rc=0
            python3 -u "$S" "$target" 2>&1 | tee -a patch.log || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "PATCH-FEHLER: $name endete mit Exit-Code $rc" | tee -a patch.log
            fi
            h2=$(tree_hash)
            if [ "$h1" = "$h2" ]; then
              echo "PATCH-WARNUNG: $name hat NICHTS veraendert" | tee -a patch.log
            fi
          }

          # Eigenes CMake-Patch-Skript anwenden, falls vorhanden; sonst minimalen
          # Linux/aarch64-Einstieg in CMakeLists.txt anlegen, damit xportcore baut.
          if [ -n "$(find_script mc3-linux-cmake.py)" ]; then
            apply mc3-linux-cmake.py CMakeLists.txt
          else
            python3 - <<'PY'
from pathlib import Path

cm = Path("CMakeLists.txt")
txt = cm.read_text(encoding="utf-8")
marker = "# RK3326 / Linux aarch64 port target"
if marker not in txt:
    addition = f"""
{marker}
if(NOT WIN32 AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(aarch64|arm64)$")
    if(TARGET xportcore)
        add_executable(mc3port_rk3326 src/pc/game_disc.cpp)
        target_link_libraries(mc3port_rk3326 PRIVATE xportcore)
        target_include_directories(mc3port_rk3326 PRIVATE src ${{XPORT_DIR}}/src)
        target_compile_definitions(mc3port_rk3326 PRIVATE MC3PORT_VERSION="${{PROJECT_VERSION}}" RK3326_PORT=1)
        xport_identity(mc3port_rk3326 mc3port MC3PORT MC3_)
    endif()
endif()
"""
    cm.write_text(txt + addition, encoding="utf-8")
    print("CMakeLists.txt um minimalen RK3326/aarch64-Einstieg (xportcore + game_disc) erweitert.")
PY
          fi

          # Weitere mc3-*.py Patches hier bei Bedarf einhaengen:
          # apply mc3-gles-renderer.py src
          # apply mc3-sdl2-input-audio.py src
          # apply mc3-rk3326-mem-budget.py src

          echo "== Patches fertig ==" | tee -a patch.log

          TOTAL=$(grep -cE 'PATCH-FEHLER:|PATCH-WARNUNG:' patch.log || true)
          grep -E 'PATCH-FEHLER:|PATCH-WARNUNG:' patch.log | while IFS= read -r l; do
            echo "::warning title=Patch-Problem::$l"
          done || true
          echo "Patch-Probleme gesamt: $TOTAL"
          if [ "$TOTAL" -gt 0 ] && [ "${MC3_PATCH_STRICT:-0}" = "1" ]; then
            echo "::error::Strict-Modus: $TOTAL Patch-Problem(e), siehe patch.log"
            exit 1
          fi

      - name: Patch-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-log
          path: patch.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Gepatchte Quellen sichern
        if: always()
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/patched-sources"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a CMakeLists.txt "$OUT/CMakeLists.txt" 2>/dev/null || true
          find src external/xport -maxdepth 4 -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' -o -name '*.cmake' \) 2>/dev/null | while IFS= read -r f; do
            mkdir -p "$OUT/$(dirname "$f")"
            cp -a "$f" "$OUT/$f"
          done

      - name: Upload gepatchte Quellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-sources
          path: patched-sources/
          retention-days: 14

      - name: CMake konfigurieren
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/aarch64-arkos.cmake" \
            -DSDL2_INSTALL_DIR="$SDL2_INSTALL" \
            -DSDL2_DIR="$SDL2_INSTALL/lib/cmake/SDL2" \
            -DCMAKE_PREFIX_PATH="$SDL2_INSTALL;$SYSROOT_LIB" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_FLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe" \
            -DCMAKE_CXX_FLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe"

      - name: Bauen
        run: cmake --build "$BUILD_DIR" -j "$JOBS"

      - name: Kompatibilitaet pruefen (glibc, Bibliotheken)
        run: |
          set -euo pipefail
          BIN=$(find "$BUILD_DIR" -maxdepth 3 -type f -executable ! -name '*.so*' ! -name '*.a' | head -n 1)
          if [ -z "$BIN" ]; then
            echo "::error::Kein ausfuehrbares Binary in $BUILD_DIR gefunden"
            exit 1
          fi
          echo "Pruefe Binary: $BIN"
          file "$BIN"

          echo "== NEEDED =="
          aarch64-linux-gnu-readelf -d "$BIN" | grep NEEDED || true
          if aarch64-linux-gnu-readelf -d "$BIN" | grep -q 'libgomp'; then
            echo "::notice title=OpenMP::Binary braucht libgomp.so.1 auf dem Geraet."
          fi

          maxver() {
            aarch64-linux-gnu-objdump -T "$BIN" \
              | { grep -oE "$1_[0-9][0-9.]*" || true; } \
              | sed "s/^$1_//" | sort -Vu | tail -1
          }
          G=$(maxver GLIBC);  X=$(maxver GLIBCXX);  C=$(maxver CXXABI)
          echo "Hoechste benoetigte Versionen: GLIBC=${G:-keine} GLIBCXX=${X:-keine} CXXABI=${C:-keine}"
          echo "::notice title=Symbolversionen::GLIBC ${G:-keine}, GLIBCXX ${X:-keine}, CXXABI ${C:-keine}"

          if [ -n "$G" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$G" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error title=glibc zu neu::Binary braucht GLIBC_$G, das Geraet hat nur $MAX_GLIBC"
            exit 1
          fi

      - name: Bundle fuer M9 Pro vorbereiten
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/mc3port/libs.aarch64" "$STAGE/mc3port/shader_cache" "$STAGE/mc3port/saves"

          BIN=$(find "$BUILD_DIR" -maxdepth 3 -type f -executable ! -name '*.so*' ! -name '*.a' | head -n 1)
          install -m 755 "$BIN" "$STAGE/mc3port/mc3port"

          for so in $(find "$BUILD_DIR" -name '*.so*' -type f); do
            cp -a "$so" "$STAGE/mc3port/libs.aarch64/"
          done

          if [ -d "$SDL2_INSTALL/lib" ]; then
            for f in "$SDL2_INSTALL/lib"/libSDL2-2.0.so*; do
              [ -e "$f" ] || continue
              cp -a "$f" "$STAGE/mc3port/libs.aarch64/"
            done
          fi

          cat > "$STAGE/MC3Port.sh" <<'EOF'
#!/bin/bash
set -uo pipefail
PORT_DIR="/roms/ports/mc3port"
[ -d "$PORT_DIR" ] || PORT_DIR="$(cd "$(dirname "$0")/mc3port" && pwd)"
export LD_LIBRARY_PATH="$PORT_DIR/libs.aarch64:${LD_LIBRARY_PATH:-}"
cd "$PORT_DIR" || exit 1
exec ./mc3port > "$PORT_DIR/mc3port.log" 2>&1
EOF

          find "$STAGE" -type d -exec chmod 755 {} \;
          find "$STAGE" -type f -exec chmod 644 {} \;
          chmod 755 "$STAGE/MC3Port.sh" "$STAGE/mc3port/mc3port"
          touch "$STAGE/mc3port/shader_cache/.gitkeep" "$STAGE/mc3port/saves/.gitkeep"

      - name: Tarball erzeugen
        run: |
          set -euo pipefail
          cd dist
          tar -czf mc3port-rk3326.tar.gz mc3port MC3Port.sh

      - name: Upload Artefakt (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: mc3port-rk3326
          path: dist/mc3port-rk3326.tar.gz
          retention-days: 30
          if-no-files-found: error
